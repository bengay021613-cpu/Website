<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quiz Lưu Quang Vũ</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#6dd5fa,#2980b9);
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

#box{
background:white;
width:650px;
max-width:90%;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
text-align:center;
}

h2{
margin-bottom:20px;
}

.answer{
display:block;
padding:12px;
margin:10px 0;
border-radius:10px;
border:2px solid #ddd;
cursor:pointer;
transition:0.25s;
}

.answer:hover{
transform:scale(1.05);
background:#f2f8ff;
}

.correct{
background:#2ecc71;
color:white;
}

.wrong{
background:#e74c3c;
color:white;
}

#next{
margin-top:20px;
padding:10px 20px;
border:none;
background:#3498db;
color:white;
border-radius:10px;
cursor:pointer;
}

#next:hover{
background:#217dbb;
}

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}

</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div id="box">

<div id="start">

<h1>Mini Quiz</h1>

<p>Chúng ta cùng tìm hiểu về tác giả Lưu Quang Vũ</p>

<br><br>

<button onclick="startQuiz()" id="next">Bắt đầu</button>

</div>

<div id="quiz" style="display:none">

<h2 id="question"></h2>

<div id="answers"></div>

<button id="next" onclick="nextQuestion()">Câu tiếp theo</button>

</div>

</div>

<script>

const quiz=[

{
q:"Lưu Quang Vũ sinh năm nào?",
a:["1948","1950","1945","1960"],
correct:0
},

{
q:"Lưu Quang Vũ sinh ra ở đâu?",
a:["Hà Nội","Phú Thọ","Huế","Đà Nẵng"],
correct:1
},

{
q:"Lĩnh vực Lưu Quang Vũ nổi tiếng nhất là gì?",
a:["Tiểu thuyết","Hội họa","Kịch","Âm nhạc"],
correct:2
},

{
q:"Ông được biết đến như một trong những nhà viết kịch nổi bật của Việt Nam thời kỳ nào?",
a:["Sau 1975","Trước 1945","Thời trung đại","Thời phong kiến"],
correct:0
},

{
q:"Tác phẩm nào sau đây là của Lưu Quang Vũ?",
a:["Tôi và chúng ta","Tắt đèn","Số đỏ","Vợ chồng A Phủ"],
correct:0
}

]

let current=0
let score=0
let answered=false

const question=document.getElementById("question")
const answers=document.getElementById("answers")

function startQuiz(){

document.getElementById("start").style.display="none"
document.getElementById("quiz").style.display="block"

loadQuestion()

}

function loadQuestion(){

answered=false

let q=quiz[current]

question.innerText=q.q

answers.innerHTML=""

q.a.forEach((text,index)=>{

let btn=document.createElement("div")

btn.className="answer"

btn.innerText=text

btn.onclick=()=>selectAnswer(btn,index)

answers.appendChild(btn)

})

}

function selectAnswer(btn,index){

if(answered) return

let correct=quiz[current].correct

if(index===correct){

answered=true
score++

btn.classList.add("correct")

btn.style.transform="scale(1.15)"
btn.style.boxShadow="0 0 15px #2ecc71"

}else{

btn.classList.add("wrong")

btn.animate(
[
{transform:"translateX(0px)"},
{transform:"translateX(-8px)"},
{transform:"translateX(8px)"},
{transform:"translateX(-8px)"},
{transform:"translateX(0px)"}
],
{duration:300}
)

setTimeout(()=>{
btn.classList.remove("wrong")
},500)

}

}

function nextQuestion(){

if(!answered){
alert("Bạn cần chọn đáp án đúng trước!")
return
}

current++

if(current<quiz.length){

loadQuestion()

}else{

showResult()

}

}

function showResult(){

document.getElementById("box").innerHTML=`

<h1>🎉 Chúc mừng!</h1>

<p>Bạn đạt ${score}/5 điểm</p>

<p>Cùng chúng mình tiếp tục tìm hiểu sâu hơn về tác phẩm của Lưu Quang Vũ.</p>

<br><br>

<button onclick="location.reload()" id="next">Chơi lại</button>

`

launchConfetti()

}

function launchConfetti(){

const canvas=document.getElementById("confetti")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let pieces=[]

for(let i=0;i<80;i++){

pieces.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height-canvas.height,
size:6,
speed:2+Math.random()*3,
color:`hsl(${Math.random()*360},80%,60%)`
})

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

pieces.forEach(p=>{

ctx.fillStyle=p.color
ctx.fillRect(p.x,p.y,p.size,p.size)

p.y+=p.speed

if(p.y>canvas.height)p.y=-10

})

requestAnimationFrame(draw)

}

draw()

}

</script>

</body>
</html>
</script>

</body>
</html>
