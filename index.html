<!DOCTYPE html>

  <title>Lưu bút cuối cấp của Quốc Anh</title>

  <style>
    body {

    .card {
      background: white;

      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
      margin-top: 40px;
    }

    h1 {
      font-size: 48px;
    }

    .avatar {

      border-radius: 50%;

    button {

<body>

<div class="container">

  <div class="card">
    <p>12AV2 • Niên khóa cuối cấp 🎓</p>

    <h1>Lưu bút cuối cấp của Quốc Anh</h1>

      <input name="name" type="text" placeholder="Tên của bạn">

      <textarea name="message" placeholder="Lời nhắn dành cho Quốc Anh"></textarea>

      <textarea name="memory" placeholder="Kỷ niệm đáng nhớ nhất với Quốc Anh"></textarea>

      <textarea name="secret" placeholder="Điều muốn nói nhưng ngại nói 😭"></textarea>

      <input name="threeWords" type="text" placeholder="Miêu tả Quốc Anh bằng 3 từ">

      <label>
        <input name="anonymous" type="checkbox">

      </label>

      <button type="submit">
        Gửi lưu bút 💙
      </button>
    </form>
  </div>
</div>

<script>
document.getElementById("luubutForm")
.addEventListener("submit", async function(e) {
  e.preventDefault();

  const formData = {
    name: this.name.value,
    message: this.message.value,
    memory: this.memory.value,
    secret: this.secret.value,
    threeWords: this.threeWords.value,
    anonymous: this.anonymous.checked
  };

  await fetch(
    "https://script.google.com/macros/s/AKfycbxNMlvKJ45M-kQYi902HrjbHALoDFGxXeHUGm5ipb3w-h9clpwJaSAKdaKzofDrYN-Ryg/exec",
    {
      method: "POST",
      body: JSON.stringify(formData)
    }
  );

  alert("Lưu bút đã gửi thành công 💙");
  this.reset();
});
</script>
